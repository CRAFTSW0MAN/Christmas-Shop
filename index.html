<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Christmas shop</title>
    <link rel="stylesheet" href="./css/index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Allura&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <div class="header__logo">
          <img
            class="header__logo-image"
            src="./assets/icons/Vector.png"
            alt="logo"
          />
          <p class="header__logo-text">the gifts</p>
        </div>

        <nav class="header__nav">
          <ul class="nav__list">
            <li class="nav__item">
              <a class="nav__link" href="#Favorite-coffee">Gifts</a>
            </li>
            <li class="nav__item">
              <a class="nav__link" href="#About">About</a>
            </li>
            <li class="nav__item">
              <a class="nav__link" href="#Mobile-app">Rest</a>
            </li>
            <li class="nav__item">
              <a class="nav__link" href="#Contact-us">Contacts</a>
            </li>
          </ul>
        </nav>
      </header>

      <section class="hero">
        <div class="hero__content">
          <p class="hero__subtitle">Merry Christmas</p>
          <h1 class="hero__title">
            Gift yourself the magic of new possibilities
          </h1>
          <button class="hero__button">Explore Magical Gifts</button>
          <p class="hero__subtitle">and Happy New Year</p>
        </div>
      </section>
    </main>
  </body>
</html>
